<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PR7 Murcia FS - Escáner</title>

  <!-- Librería QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f9;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .contenedor {
      max-width: 550px;
      margin: auto;
    }

    .cabecera {
      background: linear-gradient(135deg, #071b4d, #0d3b9e);
      color: white;
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .cabecera h1 {
      margin: 0;
      font-size: 28px;
    }

    .cabecera p {
      margin: 8px 0 0;
      opacity: .9;
    }

    .tarjeta {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.10);
    }

    .titulo {
      text-align: center;
      color: #071b4d;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .instrucciones {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #reader video {
      border-radius: 15px;
    }

    .mensaje {
      text-align: center;
      margin-top: 15px;
      padding: 12px;
      background: #f4f6f9;
      border-radius: 12px;
      color: #555;
      font-size: 14px;
    }

    .boton {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .azul {
      background: #071b4d;
      color: white;
    }

    .resultado {
      display: none;
      text-align: center;
      border-radius: 20px;
      padding: 25px 20px;
      margin-top: 20px;
    }

    .permitido {
      background: #dff7e8;
      border: 3px solid #16803c;
      color: #126b32;
    }

    .utilizado {
      background: #ffe2e2;
      border: 3px solid #c62828;
      color: #a51f1f;
    }

    .error {
      background: #fff0d6;
      border: 3px solid #d88a00;
      color: #8a5800;
    }

    .icono {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .resultado h2 {
      font-size: 28px;
      margin: 5px 0 15px;
    }

    .titular {
      font-size: 23px;
      font-weight: bold;
      margin: 10px 0;
    }

    .dato {
      font-size: 14px;
      margin: 6px 0;
    }

    .oculto {
      display: none;
    }
  </style>

</head>

<body>

<div class="contenedor">

  <div class="cabecera">
    <h1>PR7 MURCIA FS</h1>
    <p>Control de acceso · Temporada 26/27</p>
  </div>


  <!-- ESCÁNER -->

  <div id="zonaEscaner" class="tarjeta">

    <div class="titulo">
      📷 ESCÁNER DE ABONOS
    </div>

    <div class="instrucciones">
      Apunta la cámara trasera del móvil al código QR del abono.
      <br>
      El sistema lo reconocerá automáticamente.
    </div>

    <div id="reader"></div>

    <div id="mensaje" class="mensaje">
      Preparando cámara...
    </div>

  </div>


  <!-- RESULTADO -->

  <div id="resultado" class="resultado">

    <div id="icono" class="icono"></div>

    <h2 id="tituloResultado"></h2>

    <div id="titular" class="titular"></div>

    <div id="datosResultado"></div>

    <button
      id="botonSiguiente"
      class="boton azul"
      onclick="siguienteAbono()">

      📷 SIGUIENTE ABONO

    </button>

  </div>

</div>


<script>

  /*
   * URL DE TU GOOGLE APPS SCRIPT
   *
   * IMPORTANTE:
   * Aquí ponemos solamente la URL /exec,
   * SIN ?codigo=
   */

  var URL_SISTEMA =
    "https://script.google.com/macros/s/AKfycbxcvmR1nnLBsWeK1eQNput-8dWPnuey4IXm0z4XNHS1rSb7Z1HklXiIUOAFcTq98du7ITw/exec";


  var scanner = null;

  var escaneando = false;

  var procesando = false;


  /*
   * INICIAR ESCÁNER
   */

  function iniciarScanner() {

    document.getElementById("mensaje").innerHTML =
      "Solicitando acceso a la cámara...";


    if (scanner) {

      try {
        scanner.clear();
      } catch (e) {}

    }


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      function(codigo) {

        if (procesando) {
          return;
        }

        procesando = true;

        procesarCodigo(codigo);

      },

      function(error) {

        /*
         * No mostramos los errores normales
         * mientras la cámara está buscando QR.
         */

      }

    )

    .then(function() {

      escaneando = true;

      document.getElementById("mensaje").innerHTML =
        "📷 <strong>Cámara activa.</strong><br>" +
        "Apunta al código QR del abono.";

    })

    .catch(function(error) {

      escaneando = false;

      console.error(error);

      document.getElementById("mensaje").innerHTML =
        "❌ <strong>No se ha podido abrir la cámara.</strong><br><br>" +
        "Comprueba que Safari o Chrome tienen permiso " +
        "para utilizar la cámara y vuelve a intentarlo.";

      procesando = false;

    });

  }


  /*
   * PROCESAR QR
   */

  function procesarCodigo(codigo) {

    document.getElementById("mensaje").innerHTML =
      "⏳ QR detectado.<br>" +
      "Comprobando abono...";


    /*
     * Paramos la cámara antes de enviar
     * el código al sistema.
     */

    detenerScanner().then(function() {


      /*
       * Si el QR ya contiene una URL completa
       * con ?codigo=...
       */

      if (
        codigo.indexOf("?codigo=") !== -1
      ) {

        window.location.href = codigo;

        return;

      }


      /*
       * Si el QR contiene solamente
       * el código del abono.
       */

      var codigoLimpio =
        codigo
          .trim()
          .toUpperCase();


      /*
       * Abrimos el sistema de validación
       */

      window.location.href =
        URL_SISTEMA +
        "?codigo=" +
        encodeURIComponent(codigoLimpio);

    });

  }


  /*
   * DETENER CÁMARA
   */

  function detenerScanner() {

    if (
      scanner &&
      escaneando
    ) {

      escaneando = false;

      return scanner.stop()

        .then(function() {

          try {
            scanner.clear();
          } catch (e) {}

        })

        .catch(function(error) {

          console.log(
            "Error deteniendo cámara:",
            error
          );

        });

    }


    return Promise.resolve();

  }


  /*
   * SIGUIENTE ABONO
   */

  function siguienteAbono() {

    /*
     * Volvemos a poner el escáner
     */

    document.getElementById(
      "resultado"
    ).style.display = "none";


    document.getElementById(
      "zonaEscaner"
    ).style.display = "block";


    document.getElementById(
      "mensaje"
    ).innerHTML =
      "Preparando cámara...";


    procesando = false;


    /*
     * Esperamos un momento antes de
     * volver a pedir la cámara.
     */

    setTimeout(function() {

      iniciarScanner();

    }, 500);

  }


  /*
   * ARRANCAR AUTOMÁTICAMENTE
   */

  window.addEventListener(
    "load",
    function() {

      setTimeout(function() {

        iniciarScanner();

      }, 500);

    }
  );

</script>

</body>

</html>
